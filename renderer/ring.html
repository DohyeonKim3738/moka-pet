<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>돌보기</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;
  -webkit-user-select:none;user-select:none;
  font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;}
/* max-content, or the wrap can never measure wider than the window it is
   already in — and the window only grows once the wrap says it needs to.
   Laid out at its natural width, offsetWidth is the answer. */
#wrap{padding:6px;width:max-content}
#bar{display:flex;gap:5px;justify-content:center}

/* the tray: what is on the menu, or what you could play. One click on 밥
   used to serve whatever the pet liked and give you no say; the bar is
   the only place most people ever press, so the choice has to be here. */
#tray{display:none;margin-top:5px}
#tray.on{display:block}
#tray .row{display:flex;gap:4px;align-items:center;margin-top:4px;flex-wrap:nowrap}
#tray .row:first-child{margin-top:0}
#tray .lb{flex:0 0 28px;font-size:10px;font-weight:700;color:#3B322A;opacity:.65}
#tray button{
  width:auto;height:26px;padding:0 9px;font-size:11px;font-weight:700;
  border-width:2px;box-shadow:2px 2px 0 rgba(59,50,42,.22);
}
#tray button.fav{background:#F6E2C0}
#tray button.again{border-style:dashed;opacity:.7}
button{
  appearance:none;cursor:pointer;
  width:40px;height:40px;padding:0;
  background:#FFFDF7;border:3px solid #3B322A;
  box-shadow:3px 3px 0 rgba(59,50,42,.22);
  font-size:11px;font-weight:700;color:#3B322A;line-height:1.1;
}
button:hover{background:#F6E2C0}
button:active{box-shadow:1px 1px 0 rgba(59,50,42,.22);transform:translate(2px,2px)}
/* ★비활성 버튼은 마우스 이벤트를 삼켜 title 툴팁이 뜨지 않는다.
   통과시키고, 이유는 아래 줄에 글로 띄운다 — 막대는 창이 작아서
   떠 있는 상자보다 줄이 낫다(창이 그만큼 늘어난다). */
button:disabled{opacity:.45;cursor:default;pointer-events:none}
.row .no{font-size:10px;color:#A6957F;margin-left:4px;align-self:center}
/* ★힌트는 막대 '위'에 둔다. 막대는 창 아래에 붙어 있고 창은 위로 자라므로,
   아래에 두면 막대가 커서에서 밀려나 힌트가 스스로를 지워 버린다
   (첫 번째 호버가 안 뜨던 이유). */
#why{font-size:11px;color:#6B5E4E;background:#F3E4C6;border-radius:8px;
  padding:4px 9px;margin-bottom:5px;white-space:nowrap}
#why:empty{display:none}
button[hidden]{display:none}
#egg{opacity:1;font-size:10px}
button .ic{display:block;font-size:15px}
</style></head>
<body>
  <div id="wrap">
  <div id="why"></div>
  <div id="bar">
    <button id="feed"><span class="ic">🍚</span>밥</button>
    <button id="play"><span class="ic">🎾</span>놀기</button>
    <button id="sleep"><span class="ic">💤</span>잠</button>
    <button id="egg" disabled hidden><span class="ic">🥚</span><span id="eggPct">0%</span></button>
    <button id="info"><span class="ic">ℹ️</span>정보</button>
  </div>
  <div id="tray"></div>
  </div>
<script>
(function(){
  "use strict";
  var api = window.ring || { onState:function(){}, act:function(){}, hover:function(){}, info:function(){} };
  var sleepBtn = document.getElementById('sleep');

  var tray = document.getElementById('tray');
  var open = null;          // 'feed' or 'play', or null when shut
  var state = null;

  /* Tell the window how much room the bar needs now. Measured rather than
     assumed: the tray's width depends on how many dishes have been
     learned, and Korean labels are not a fixed width. */
  function resize(){
    var w = document.getElementById('wrap');
    api.size(Math.ceil(Math.max(w.offsetWidth, w.scrollWidth)),
             Math.ceil(Math.max(w.offsetHeight, w.scrollHeight)));
  }

  /* why: 지금 이 줄을 못 하는 이유(없으면 null).
     ★낱개 음식을 잠그지 않았더니, 배가 불러 밥이 막힌 상태에서도 「한식」이
     눌렸다. 눌러도 아무 일이 없고 설명도 없다 — 고장으로 읽힌다.
     밥과 간식은 배부른 기준이 서로 달라서(95 / 99) 한쪽만 막히는 구간이
     실제로 생긴다. 줄마다 따로 잠근다. */
  function row(label, list, act, fav, last, why){
    var known = (list || []).filter(function(f){ return !f.lock; });
    if (!known.length) return '';
    return '<div class="row"><span class="lb">' + label + '</span>' +
      known.map(function(f){
        var cls = f.id === fav ? ' class="fav"' : (f.id === last ? ' class="again"' : '');
        return '<button data-pick="' + act + ':' + f.id + '"' + cls +
               (why ? ' disabled title="' + why + '"' : '') + '>' + f.label + '</button>';
      }).join('') +
      (why ? '<span class="no">' + why + '</span>' : '') + '</div>';
  }

  function drawTray(){
    if (!open || !state || state.egg) { tray.className = ''; tray.innerHTML = ''; resize(); return; }
    var no = state.blocked || {};
    tray.innerHTML = (open === 'feed')
      ? row('밥', state.meals, 'feed', state.favMeal, state.lastMeal, no.feed) +
        row('간식', state.snacks, 'snack', state.favSnack, state.lastSnack, no.snack)
      : row('놀기', state.plays, 'play', state.favPlay, state.lastPlay, no.play);
    tray.className = 'on';
    Array.prototype.forEach.call(tray.querySelectorAll('[data-pick]'), function(b){
      b.addEventListener('click', function(){
        var v = b.getAttribute('data-pick').split(':');
        api.act(v[0], v[1]);
        open = null; drawTray();
      });
    });
    resize();
  }

  ['feed','play'].forEach(function(k){
    document.getElementById(k).addEventListener('click', function(){
      open = (open === k) ? null : k;
      hint = null;
      document.getElementById('why').textContent = '';
      drawTray();
    });
  });
  document.getElementById('sleep').addEventListener('click', function(){
    open = null; drawTray(); api.act('sleep');
  });
  document.getElementById('info').addEventListener('click', function(){ api.info(); });

  api.onState(function(c){
    if(!c) return;
    state = c;
    // the same button wakes the pet, so it has to say so
    sleepBtn.innerHTML = c.sleeping
      ? '<span class="ic">☀️</span>깨우기'
      : '<span class="ic">💤</span>잠';

    // An egg cannot be fed, played with or put to bed. Greying those out
    // still left three dead buttons on the bar, so they come off it
    // entirely and the hatching progress takes their place.
    var eggBtn = document.getElementById('egg');
    ['feed','play','sleep'].forEach(function(k){
      document.getElementById(k).hidden = !!c.egg;
    });
    eggBtn.hidden = !c.egg;
    if(c.egg){
      document.getElementById('eggPct').textContent = (c.hatch || 0) + '%';
      open = null; drawTray();
      return;
    }
    /* 막는 조건은 care.js 한 곳에서만 판단한다. 여기에 다시 적어 두었더니
       놀기의 소모량이 놀이마다 다른데도 15 로 뭉뚱그려져 있었다.
       그리고 흐려지기만 하면 왜 안 되는지 알 길이 없어서, title 로
       이유를 달아 준다 — 문구는 care.js 가 이미 들고 있던 것이다. */
    var why = c.blocked || {};
    function gate(id, reason){
      var b = document.getElementById(id);
      b.disabled = !!reason;
      b.title = reason || '';
    }
    /* 밥 버튼은 밥과 간식을 함께 여는 자리라 둘 다 막혔을 때만 잠근다.
       다만 한쪽만 막힌 구간(배고픔 95~99)이 실제로 있어서, 그냥 열어 두면
       "밥이 안 되는데 밥 버튼이 켜져 있다"로 읽힌다. 그럴 때는 무엇이
       막혔고 무엇이 되는지 버튼에 적어 둔다. */
    gate('feed', (why.feed && why.snack) ? why.feed : null);
    // 왜 막혔는지를 버튼에 심어 둔다 — 아래에서 자리로 찾아 띄운다
    [['feed', (why.feed && why.snack) ? why.feed : null],
     ['play', why.play], ['sleep', why.sleep]].forEach(function(p){
      var b = document.getElementById(p[0]);
      if (p[1]) b.setAttribute('data-why', p[1]); else b.removeAttribute('data-why');
    });
    if (why.feed && !why.snack) {
      document.getElementById('feed').title = '밥은 ' + why.feed + ' — 간식은 아직 괜찮아요';
    } else if (why.snack && !why.feed) {
      document.getElementById('feed').title = '간식은 ' + why.snack + ' — 밥은 괜찮아요';
    }
    gate('play', why.play);
    gate('sleep', why.sleep);
    if (c.sleeping) {
      sleepBtn.title = (c.napKind === 'auto')
        ? '스스로 잠들었어요 — 깨우면 그대로 깨어 있어요'
        : '깨우기';
    }
    if (open && document.getElementById(open).disabled) open = null;
    drawTray();
  });

  /* Leaving the WINDOW, not leaving a button.
   *
   * These were on `document` with capture, so every mouseleave from any
   * child counted: moving off the 밥 button — towards the very tray it had
   * just opened — reported "pointer gone", which shut the tray and started
   * the bar's hide timer. The dishes could be seen and never reached.
   *
   * mouseleave does not bubble, so a plain listener on the root element
   * fires once, when the pointer actually leaves the page. */
  /* 막힌 버튼 위에 커서를 두면 이유를 한 줄로 띄운다. 트레이가 열려
     있을 때는 건드리지 않는다 — 고르던 것을 지워 버리면 안 된다. */
  var hint = null;
  function whyAt(x, y){
    var hit = null;
    Array.prototype.forEach.call(document.querySelectorAll('#bar [data-why]'), function(el){
      var r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = el;
    });
    return hit ? hit.getAttribute('data-why') : null;
  }
  var whyBox = document.getElementById('why');
  document.addEventListener('mousemove', function(e){
    if (open) { if (hint) { hint = null; whyBox.textContent = ''; resize(); } return; }
    var w = whyAt(e.clientX, e.clientY);
    if (w === hint) return;
    hint = w;
    whyBox.textContent = w || '';
    resize();
  });

  var root = document.documentElement;
  root.addEventListener('mouseenter', function(){ api.hover(true); });
  root.addEventListener('mouseleave', function(){
    api.hover(false);
    if (open) { open = null; drawTray(); }
  });
})();
</script>
</body></html>
