<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<style>
:root{
  --bg:#F2F1EE; --card:#FFFFFF; --line:#E4E2DD;
  --text:#1D1B18; --muted:#8B8780; --track:#E6E4DF; --fill:#B98052;
  --knob:#FFFFFF; --accent:#B98052;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B1A18; --card:#252320; --line:#343128;
    --text:#F0EDE7; --muted:#9A948B; --track:#3A3630; --fill:#D2A374;
    --knob:#F0EDE7; --accent:#D2A374;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;
}

/* The frameless window has no title bar of its own, so this strip is
   both the drag handle and the place the title can sit without the
   traffic lights sitting on top of it. */
header{
  -webkit-app-region:drag;
  flex:0 0 auto;
  height:38px;padding:0 16px 0 82px;
  display:flex;align-items:center;
}
header h1{
  font-size:13px;font-weight:600;color:var(--muted);
  margin:0;letter-spacing:.02em;
}
header #ver{font-weight:500;opacity:.65}
main{flex:1 1 auto;padding:4px 18px 18px;overflow:auto}

.card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:20px;
}
.card + .card{margin-top:10px}
.label{flex:0 0 auto;min-width:150px}
.label .t{font-size:15px;font-weight:600;line-height:1.3}
.label .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.ctl{flex:1 1 auto;display:flex;align-items:center;gap:12px;justify-content:flex-end}

input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;
  flex:1 1 auto;min-width:120px;max-width:420px;height:26px;margin:0;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;
  /* --p is the filled fraction, set from script */
  background:linear-gradient(to right,
    var(--fill) 0% calc(var(--p,0) * 100%),
    var(--track) calc(var(--p,0) * 100%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;
  background:var(--knob);border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.14);
  margin-top:-9px;
}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 1px 5px rgba(0,0,0,.22)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}

.value{
  flex:0 0 auto;min-width:56px;text-align:right;
  font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);
}
.reset{
    flex:0 0 auto;appearance:none;border:1px solid var(--line);background:transparent;
  color:var(--muted);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:8px;cursor:pointer;
}
.reset:hover{color:var(--text);border-color:var(--muted)}

.note{margin:12px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}

.stack{display:block}
.stack .ctl{justify-content:flex-start;margin-top:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:20px}
.row .label{flex:1 1 auto}

input[type=text],input[type=password],input[type=time]{
    font:inherit;font-size:12.5px;color:var(--text);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;min-width:0;
}
input[type=text],input[type=password]{flex:1 1 200px}
input::placeholder{color:var(--muted)}

button.primary{
    appearance:none;border:0;border-radius:8px;cursor:pointer;
  background:var(--fill);color:#fff;font:inherit;font-size:12.5px;font-weight:600;
  padding:8px 14px;
}
button.primary:disabled{opacity:.45;cursor:default}

.state{font-size:12.5px;color:var(--muted)}
.state.ok{color:#3F8A6A;font-weight:600}
.state.bad{color:#C9492F}

.sub{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.sub span{font-size:12.5px}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.hint a{color:var(--accent)}

input[type=checkbox]{accent-color:var(--fill);width:15px;height:15px}
</style>
</head>
<body>
  <header><h1>모카펫 설정 <span id="ver"></span></h1></header>

  <main>
    <div class="card">
      <div class="label">
        <div class="t">펫 크기</div>
        <div class="d">펫 크기를 조정합니다</div>
      </div>
      <div class="ctl">
        <input id="scale" type="range" min="10" max="200" step="1" value="100" aria-label="펫 크기">
        <span class="value" id="scaleOut">100%</span>
        <button class="reset" id="reset" title="100%로 되돌리기">기본값</button>
      </div>
    </div>

    <p class="note">
      10%부터 200%까지 1% 단위로 조절합니다. 슬라이더를 클릭한 뒤 방향키로 1%씩,
      Shift+방향키로 10%씩 움직일 수 있습니다.
    </p>

    <div class="card stack" style="margin-top:16px">
      <div class="row">
        <div class="label">
          <div class="t">구글 캘린더</div>
          <div class="d">일정 시작 전에 펫이 알려줍니다</div>
        </div>
        <span class="state" id="gState">확인 중…</span>
      </div>

      <div id="gSetup">
        <div class="ctl">
          <input id="gId" type="text" placeholder="클라이언트 ID" autocomplete="off" spellcheck="false">
          <input id="gSecret" type="password" placeholder="클라이언트 보안 비밀번호" autocomplete="off">
          <button class="primary" id="gSave">저장</button>
        </div>
        <div class="hint">
          구글 클라우드 콘솔에서 <b>데스크톱 앱</b> 유형으로 만든 값입니다.
          이 값과 로그인 정보는 이 컴퓨터에만 암호화해 저장되고 어디로도 전송되지 않습니다.
        </div>
      </div>

      <div class="sub" id="gUseBundled" style="display:none">
        <span>이 앱에는 클라이언트가 내장되어 있습니다.</span>
        <button class="reset" id="gBundled">내장 값 사용</button>
      </div>

      <div class="ctl" id="gAuth">
        <button class="primary" id="gLogin">구글로 로그인</button>
        <button class="primary" id="gLogout" style="display:none;background:transparent;color:var(--muted);border:1px solid var(--line)">연결 해제</button>
      </div>

      <div id="gOpts" style="display:none">
        <div class="sub">
          <input type="checkbox" id="cEnabled">
          <span>일정 알림 켜기</span>
        </div>
        <div class="sub">
          <span>시작</span>
          <input type="range" id="cLead" min="1" max="60" step="1" style="max-width:220px">
          <span class="value" id="cLeadOut">10분</span>
          <span>전에 알림</span>
        </div>
        <div class="sub">
          <input type="checkbox" id="cBrief">
          <span>아침에 오늘 일정 브리핑</span>
          <input type="time" id="cBriefAt">
        </div>
      </div>
    </div>
  </main>

<script>
(function(){
  "use strict";
  // outside Electron (design preview) there is no bridge; degrade quietly
  // 집에서 지내기 lives in the care window, next to the four slots it
  // controls — a lone switch here could turn the room on with no way to
  // put anything in it.
  var bridge = window.settings || { onConfig: function(){}, setPct: function(){}, ready: function(){} };
  var slider = document.getElementById('scale');
  var out    = document.getElementById('scaleOut');
  var reset  = document.getElementById('reset');

  function paint(){
    var min = +slider.min, max = +slider.max, v = +slider.value;
    out.textContent = v + '%';
    slider.style.setProperty('--p', (v - min) / (max - min));
  }

  function push(){
    paint();
    bridge.setPct(+slider.value);
  }

  bridge.onConfig(function(cfg){
    if(!cfg) return;
    if(cfg.min) slider.min = cfg.min;
    if(cfg.max) slider.max = cfg.max;
    slider.value = cfg.pct || 100;
    paint();
  });

  // live while dragging, so the pet resizes under the cursor
  slider.addEventListener('input', push);

  // Shift+arrow for a coarser step; the browser only gives us 1 by default
  slider.addEventListener('keydown', function(e){
    if(!e.shiftKey) return;
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 10
          : (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') ? -10 : 0;
    if(!d) return;
    e.preventDefault();
    slider.value = Math.max(+slider.min, Math.min(+slider.max, +slider.value + d));
    push();
  });

  reset.addEventListener('click', function(){
    slider.value = 100;
    push();
  });

  /* ---------- google calendar ---------- */
  var gState  = document.getElementById('gState');
  var gSetup  = document.getElementById('gSetup');
  var gOpts   = document.getElementById('gOpts');
  var gId     = document.getElementById('gId');
  var gSecret = document.getElementById('gSecret');
  var gSave   = document.getElementById('gSave');
  var gLogin  = document.getElementById('gLogin');
  var gLogout = document.getElementById('gLogout');

  var cEnabled = document.getElementById('cEnabled');
  var cLead    = document.getElementById('cLead');
  var cLeadOut = document.getElementById('cLeadOut');
  var cBrief   = document.getElementById('cBrief');
  var cBriefAt = document.getElementById('cBriefAt');

  function paintGoogle(cfg){
    if(!cfg) return;
    if(cfg.version) document.getElementById('ver').textContent = 'v' + cfg.version;
    if(!cfg.google) return;
    var g = cfg.google, c = cfg.cal || {};

    if(!g.canStore){
      gState.textContent = '이 시스템에서는 자격증명을 안전하게 저장할 수 없습니다';
      gState.className = 'state bad';
      gSetup.style.display = 'none';
      document.getElementById('gAuth').style.display = 'none';
      return;
    }

    // a bundled client means the teammate never needs to see these fields
    gSetup.style.display = (g.bundled || (g.hasClient && g.signedIn)) ? 'none' : '';
    // an override is in play even though the build ships a client — offer a way back
    document.getElementById('gUseBundled').style.display =
      (g.hasBundled && !g.bundled && !g.signedIn) ? '' : 'none';
    gLogin.style.display  = g.signedIn ? 'none' : '';
    gLogout.style.display = g.signedIn ? '' : 'none';
    gLogin.disabled = !g.hasClient;
    gOpts.style.display = g.signedIn ? '' : 'none';

    if(g.signedIn){
      gState.textContent = g.email ? ('연결됨 · ' + g.email) : '연결됨';
      gState.className = 'state ok';
    } else if(g.hasClient){
      gState.textContent = '로그인하면 연결됩니다';
      gState.className = 'state';
    } else {
      gState.textContent = '클라이언트 값을 입력해 주세요';
      gState.className = 'state';
    }

    cEnabled.checked = c.enabled !== false;
    cLead.value = c.leadMinutes || 10;
    cLeadOut.textContent = cLead.value + '분';
    cBrief.checked = !!c.briefEnabled;
    cBriefAt.value = c.briefAt || '09:00';
  }

  function busy(el, on, label){
    el.disabled = on;
    if(on){ el.dataset.label = el.textContent; el.textContent = label; }
    else if(el.dataset.label){ el.textContent = el.dataset.label; }
  }

  gSave.addEventListener('click', function(){
    bridge.googleSetClient(gId.value, gSecret.value).then(function(cfg){
      gSecret.value = '';
      paintGoogle(cfg);
    });
  });

  gLogin.addEventListener('click', function(){
    busy(gLogin, true, '브라우저에서 진행 중…');
    gState.textContent = '브라우저에서 구글 로그인을 마쳐 주세요';
    gState.className = 'state';
    bridge.googleSignIn().then(function(cfg){
      busy(gLogin, false);
      paintGoogle(cfg);
    }).catch(function(err){
      busy(gLogin, false);
      gState.textContent = (err && err.message ? String(err.message).replace(/^Error: /, '') : '로그인하지 못했습니다');
      gState.className = 'state bad';
    });
  });

  document.getElementById('gBundled').addEventListener('click', function(){
    bridge.googleSetClient('', '').then(paintGoogle);
  });

  gLogout.addEventListener('click', function(){
    bridge.googleSignOut().then(paintGoogle);
  });

  cEnabled.addEventListener('change', function(){ bridge.calSet({ enabled: cEnabled.checked }); });
  cBrief.addEventListener('change', function(){ bridge.calSet({ briefEnabled: cBrief.checked }); });
  cBriefAt.addEventListener('change', function(){ bridge.calSet({ briefAt: cBriefAt.value }); });
  cLead.addEventListener('input', function(){ cLeadOut.textContent = cLead.value + '분'; });
  cLead.addEventListener('change', function(){ bridge.calSet({ leadMinutes: +cLead.value }); });

  bridge.onConfig(paintGoogle);
  if(bridge.googleStatus) bridge.googleStatus().then(paintGoogle);

  bridge.ready();
})();
</script>
</body>
</html>
