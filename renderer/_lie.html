<!doctype html><html><head><meta charset="utf-8"><title>엎드려 · 자기</title>
<link rel="stylesheet" href="sprite.css">
<style>
body{margin:0;background:#EDE9E3;font:12px -apple-system,sans-serif;color:#333;padding:14px}
h2{font-size:13px;margin:10px 2px 6px;color:#555}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:#fff;border-radius:10px;padding:6px;text-align:center}
.cell svg{display:block;width:100%;height:auto}
.n{font-size:11.5px;margin-top:2px;color:#555}
</style></head><body>
<h2>엎드려 — 눈 뜨고 머리 들고 앞다리 뻗음</h2><div class="grid" id="a"></div>
<h2>자기 — 감은 눈, 웅크림</h2><div class="grid" id="b"></div>
<script>
['pixel.js','gear.js','tint.js','room.js','species.js'].forEach(function(f){
  document.write('<script src="' + f + '?' + Date.now() + Math.random() + '"><\/script>');
});
</script>
<script>
window.SPECIES.list.forEach(function(sp){
  [['a','lieMarkup'],['b','sleepMarkup']].forEach(function(pair){
    var host=document.getElementById(pair[0]);
    var d=document.createElement('div'); d.className='cell';
    var art = sp[pair[1]] ? sp[pair[1]]() : sp.markup();
    d.innerHTML='<div data-sleepart="1"><svg viewBox="20 110 220 130" style="'+
      window.TINT.css({fur:sp.fur,belly:sp.belly},sp)+'">'+art+'</svg></div>'+
      '<div class="n">'+sp.label+'</div>';
    host.appendChild(d);
  });
});
</script></body></html>
