<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>돌보기</title>
<link rel="stylesheet" href="sprite.css">
<style>
:root{
  --bg:#F2F1EE; --card:#FFFFFF; --line:#E4E2DD;
  --text:#1D1B18; --muted:#8B8780; --track:#E6E4DF; --fill:#B98052; --accent:#B98052;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1B1A18; --card:#252320; --line:#343128;
         --text:#F0EDE7; --muted:#9A948B; --track:#3A3630; --fill:#D2A374; --accent:#D2A374; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  font:14px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;}
/* flex:0 0 auto or the header is squeezed by a tall page — which is what
   happened once the game, the roster and the family tree were added: the
   bar collapsed and the cards slid up under the traffic lights. */
/* Only the header is draggable, and nothing else declares no-drag.
   Chromium builds the draggable region by subtracting every no-drag
   rectangle in the document from every drag one — so a card scrolled up
   past the top of `main` still punched a hole through the title bar, and
   the window could only be moved while scrolled to the very top. Cards
   are not inside the drag region, so they never needed no-drag at all. */
header{-webkit-app-region:drag;flex:0 0 auto;height:38px;min-height:38px;
  padding:0 16px 0 82px;display:flex;align-items:center;background:var(--bg)}
header h1{font-size:13px;font-weight:600;color:var(--muted);margin:0}
main{flex:1 1 auto;padding:4px 18px 18px;overflow:auto}

.card{background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px}
.card + .card{margin-top:10px}

.who{display:flex;align-items:baseline;gap:10px}
.who .name{font-size:19px;font-weight:700}
.who .age{font-size:13px;color:var(--muted)}
.who .badge{font-size:11.5px;color:var(--accent);border:1px solid var(--accent);
            border-radius:999px;padding:1px 8px;line-height:1.5}
.exp{margin-top:10px}
.exp .cap{font-size:11.5px;color:var(--muted);margin-top:5px}

.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill);transition:width .3s ease}

.stat{display:flex;align-items:center;gap:12px;margin-top:12px}
.stat:first-child{margin-top:0}
.stat .lb{flex:0 0 62px;font-size:13px}
.stat .bar{flex:1 1 auto}
.stat .pc{flex:0 0 42px;text-align:right;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.stat.low .bar i{background:#C9492F}
.stat.mid .bar i{background:#D89A3A}

.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{appearance:none;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px}
.acts button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.acts button:disabled{opacity:.4;cursor:default}

.sub{display:flex;align-items:center;gap:9px}
.sub span{font-size:13px}
input[type=checkbox]{accent-color:var(--fill);width:15px;height:15px}

.note{margin:12px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}
.tricks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tricks button{appearance:none;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  font:inherit;font-size:12.5px;padding:6px 14px;border-radius:999px}
.tricks button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tricks button:disabled{opacity:.45;cursor:default}
.rename{appearance:none;background:none;border:0;padding:0 2px;cursor:pointer;
  color:var(--muted);font-size:13px;line-height:1}
.rename:hover{color:var(--accent)}
.who input.nameEdit{font-size:19px;font-weight:700;color:var(--text);
  background:var(--bg);border:1px solid var(--accent);border-radius:8px;
  padding:2px 8px;width:180px;font-family:inherit}
#missions{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
#missions .ttl{font-size:12px;color:var(--muted);margin-bottom:8px}
/* the room, offered here rather than four levels into a tray menu */
#room{margin-top:14px}
/* 집 꾸미기와 소품은 같은 모양이어야 한다. 이 규칙을 #room 에만 걸어
   두었더니, 꾸미기 탭으로 옮긴 소품 드롭다운만 손대지 않은 기본 모양으로
   나왔다. */
#room .slot, #look .slot{display:flex;align-items:center;gap:8px;margin-top:6px}
#room .slot .lb, #look .slot .lb{flex:0 0 66px;color:var(--muted);font-size:11.5px}
#room .slot select option:disabled, #look .slot select option:disabled{color:var(--muted)}
#room .slot select, #look .slot select{flex:1 1 auto;font:inherit;font-size:12px;padding:4px 8px;
                   border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text)}
#room .on{display:flex;align-items:center;gap:7px;font-size:12px}
#room .hint{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.5}
#room[data-off="1"] .slot{opacity:.45}
#look .sws{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#look .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
#look .sw.on{border-color:var(--accent)}
#look .chip{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
#look .chip.on{border-color:var(--accent);color:var(--accent)}
#look #bare{margin-top:8px}
/* 「모카펫 설정」 창을 여기로 합쳤다. 자주 건드리는 것은 펴 두고, 한 번
   하고 마는 구글 연동은 접어 둔다. */
.prefs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.prefs .slot{display:flex;align-items:center;gap:8px;margin-top:6px}
.prefs .slot .lb{flex:0 0 66px;color:var(--muted);font-size:11.5px}
.prefs input[type=range]{flex:1 1 auto;min-width:90px}
.prefs .pcv{font-size:11.5px;color:var(--muted);min-width:38px;text-align:right}
.prefs details{margin-top:10px}
.prefs summary{cursor:pointer;font-size:12px;color:var(--muted);padding:3px 0}
.prefs summary::marker{color:var(--line)}
.prefs #gState{color:var(--accent)}
.prefs #gState.bad{color:#C9492F}
.prefs #gSetup{margin-top:6px}
.prefs input[type=text],.prefs input[type=password],.prefs input[type=time]{
  font:inherit;font-size:12px;padding:5px 8px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--text);width:100%;margin-top:5px}
.prefs input[type=time]{width:auto}
.prefs .hint{color:var(--muted);font-size:11px;line-height:1.5;margin:7px 0 0}
.prefs #gAuth{margin-top:8px}
.prefs .sub{margin-top:7px}
/* 막힌 이유를 title 로만 달아 두었더니, 상태가 갱신되며 버튼이 다시
   그려질 때 마우스가 그대로면 hover 가 다시 잡히지 않아 한 번 보고 나면
   끝이었다. 눈에 보이는 줄로 적는다. */
#whyacts{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.6}
#whyacts:empty{display:none}
/* ★비활성 버튼은 마우스 이벤트를 삼킨다 — 그래서 title 툴팁이 아예 뜨지
   않았다(재렌더 탓인 줄 알았는데 아니었다). 이벤트를 통과시키고 툴팁은
   직접 그린다. 통과시키면 elementFromPoint 로도 안 잡히므로, 자리를
   재서 찾는다. */
button:disabled{pointer-events:none}
#tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transition:opacity .08s;
  background:#3B322A;color:#fff;font-size:11.5px;line-height:1.4;padding:5px 9px;
  border-radius:7px;max-width:230px;box-shadow:0 2px 8px rgba(0,0,0,.22)}
#tip.on{opacity:1}

#missions ul{list-style:none;margin:0;padding:0}
#missions li{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:3px 0}
#missions li .mk{flex:0 0 14px;color:var(--muted)}
#missions li.on .mk{color:var(--accent)}
#missions li.on .nm{font-weight:700}
#missions li .pz{margin-left:auto;color:var(--muted);font-size:11.5px}
/* how far along, as a number and as a bar — five of the twelve are pure
   counting, and a target with no running total is a homework assignment */
#missions li .at{margin-left:auto;color:var(--muted);font-size:11.5px;
                 font-variant-numeric:tabular-nums;white-space:nowrap}
#missions li .at b{color:var(--text);font-weight:700}
#missions li .bar{flex:0 0 46px;height:4px;border-radius:2px;background:var(--line);
                  overflow:hidden;margin-left:8px}
#missions li .bar i{display:block;height:100%;background:var(--accent)}
#missions .badges, #badges .badges{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
/* .badges is a wrapping flex row, so the caption has to claim a whole line */
#missions .badges .pick, #badges .badges .pick{flex:0 0 100%;font-size:11px;color:var(--muted);margin:0 2px 2px}
#missions .badges button, #badges .badges button{border:1px solid var(--accent);color:var(--accent);
            background:none;border-radius:999px;padding:2px 9px;font-size:11.5px;
            cursor:pointer;font-family:inherit}
#missions .badges button.on, #badges .badges button.on{background:var(--accent);color:#fff}
/* not a title — it is the way to take one off, and should not look earned */
#missions .badges button.none, #badges .badges button.none{border-color:var(--line);color:var(--muted)}
#missions .badges button.none.on, #badges .badges button.none.on{background:var(--muted);border-color:var(--muted);color:#fff}
#missions .badges span, #badges .badges span{border:1px solid var(--accent);color:var(--accent);
  border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
#log{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
#log .ttl{font-size:12px;color:var(--muted);margin-bottom:8px}
#log ul{list-style:none;margin:0;padding:0}
#log li{display:flex;gap:10px;font-size:12px;padding:3px 0}
#log li b{font-weight:400;color:var(--muted);flex:0 0 62px}
#gameCard .ttl{font-size:12px;color:var(--muted);margin-bottom:10px}
.game{display:flex;align-items:center;gap:18px}
.game .stage{width:110px;height:110px;flex:0 0 auto}
.game .stage svg{width:100%;height:100%;display:block}
/* Mirroring the whole pet was invisible — these sprites are drawn
   face-on and are nearly symmetric. Turning the head is what reads. */
.game .stage svg #headGaze{transition:transform .18s steps(3,end)}
.game .stage.left svg #headGaze{transform:translateX(-16px)}
.game .stage.right svg #headGaze{transform:translateX(16px)}
.game .stage.left svg #bodyBreathe{transform:translateX(-5px)}
.game .stage.right svg #bodyBreathe{transform:translateX(5px)}
.game .pick{display:flex;flex-direction:column;gap:8px}
.game .pick button{appearance:none;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  font:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:10px}
.game .pick button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.game .pick button:disabled{opacity:.45;cursor:default}
#tree{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
#tree .ttl{font-size:12px;color:var(--muted);margin-bottom:8px}
#tree .line{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
/* what is on the plate — one row per course, with the note under it */
#menu{margin-top:10px}
#menu .course{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
#menu .course .lb{flex:0 0 42px;color:var(--muted);font-size:11.5px}
#menu button{appearance:none;cursor:pointer;font:inherit;font-size:12px;
             padding:4px 10px;border-radius:999px;border:1px solid var(--line);
             background:#fff;color:var(--text)}
#menu button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
#menu button:disabled{opacity:.45;cursor:default}
#menu button.fav{border-color:var(--accent);color:var(--accent);font-weight:700}
#menu button.again{border-style:dashed;color:var(--muted)}
#menu button.locked{border-style:dotted;color:var(--muted);opacity:.6}
#menu .why{flex:0 0 100%;font-size:11px;color:var(--muted);margin:1px 2px 0}

.tricks .worth{flex:0 0 100%;font-size:11px;color:var(--muted);margin:0 2px 2px}
#tree .who{display:flex;align-items:center;gap:5px;font-size:12px}
#tree .who i{width:26px;height:26px;display:block;font-style:normal}
#tree .who i svg{width:100%;height:100%;display:block}
#tree .arrow{color:var(--muted)}
#family{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
#family .ttl{font-size:12px;color:var(--muted);margin-bottom:8px}
#family .mates{display:flex;flex-wrap:wrap;gap:8px}
#family .mates button{appearance:none;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  font:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px}
#family .mates button:hover{border-color:var(--accent);color:var(--accent)}
/* after :hover, or a blocked partner would still light up under the cursor */
#family .mates button[disabled],
#family .mates button[disabled]:hover{opacity:.5;cursor:default;border-style:dashed;
                                      border-color:var(--line);color:var(--muted)}
#family .none{font-size:12px;color:var(--muted)}
#traits{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
#traits .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px}
#traits .tag b{font-weight:700;color:var(--text)}
#traits .tag.why{border-style:dashed;color:var(--muted);margin:0}
.grow .pair{display:flex;align-items:flex-end;justify-content:center;gap:18px}
.grow figure{margin:0;width:96px;text-align:center}
.grow .art{position:relative;height:96px;display:flex;align-items:flex-end;justify-content:center}
.grow .art svg{width:100%;height:100%;display:block}
/* The next stage is a shape you have not met yet: the real sprite,
   flattened to a silhouette. brightness(0) paints it black, which
   vanishes on a dark card — so dark mode inverts it to white. */
.grow .art.next svg{filter:brightness(0);opacity:.5}
@media (prefers-color-scheme: dark){
  .grow .art.next svg{filter:brightness(0) invert(1);opacity:.42}
}
/* Before it hatches even the shape is a secret, so the silhouette is a
   blank one — the real sprite would name the species. */
.grow .art.mystery::before{content:'';position:absolute;left:50%;bottom:10px;
  transform:translateX(-50%);width:62px;height:64px;
  border-radius:31px 31px 24px 24px;background:var(--text);opacity:.16}
.grow .art.next::after{content:'?';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:var(--accent)}
.grow figcaption{margin-top:6px;font-size:12px;color:#6B5E4E;white-space:nowrap}
.grow .to{padding-bottom:34px;font-size:18px;color:#C4B7A5}
#growPace{margin-top:2px;color:var(--muted)}
.pzat{display:block;font-size:10.5px;color:#B3A692;margin-top:1px}
#tabs{display:flex;gap:2px;padding:0 14px;margin-top:2px;flex-wrap:wrap}
#tabs button{font:inherit;font-size:12px;padding:5px 11px;border:0;border-radius:8px 8px 0 0;
  background:transparent;color:var(--muted);cursor:pointer}
#tabs button:hover{color:#8A6A45}
#tabs button[aria-selected="true"]{background:var(--card);color:#6B5E4E;font-weight:600}
/* 탭에 안 걸린 것은 숨긴다. 이름을 data-off 로 지었다가 #room 이
   이미 쓰고 있던 이름과 부딪혀 집 꾸미기가 통째로 사라졌다. */
[data-hide]{display:none !important}
.ladder{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:10px;
        justify-content:center;font-size:11.5px;color:#B3A692}
.ladder span.on{color:#A8763F;font-weight:600}
.ladder span.past{color:#CFC4B2}
.ladder i{font-style:normal;color:#DED5C6}
.link{appearance:none;background:none;border:0;padding:0;cursor:pointer;
  color:#9A8F80;text-decoration:underline;font:inherit}
.link:hover{color:#6B5E4E}
.link:disabled{cursor:default;text-decoration:none;color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.roster button{appearance:none;background:none;border:1px solid transparent;border-radius:10px;
  padding:4px 2px 5px;cursor:default;font:inherit;color:var(--muted);text-align:center}
.roster button.met{cursor:pointer}
.roster button.met:hover{border-color:var(--line);background:var(--bg)}
.roster button.here{border-color:var(--accent)}
.roster .slot{height:44px;display:flex;align-items:flex-end;justify-content:center}
.roster svg{width:100%;height:100%;display:block}
.roster button:not(.met) svg{filter:brightness(0);opacity:.3}
@media (prefers-color-scheme: dark){
  .roster button:not(.met) svg{filter:brightness(0) invert(1);opacity:.28}
}
.roster .nm{display:block;font-size:10.5px;margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.roster button.met .nm{color:var(--text)}
</style></head>
<body>
  <header><h1>돌보기 <span id="ver"></span></h1></header>
  <nav id="tabs"></nav>
  <div id="tip"></div>
  <main>
    <div class="card">
      <div class="who">
        <span class="name" id="name">—</span>
        <button class="rename" id="rename" title="이름 바꾸기">✎</button>
        <span class="age" id="age"></span>
        <span class="badge" id="badge" hidden></span>
      </div>
      <div class="exp">
        <div class="bar"><i id="expBar" style="width:0%"></i></div>
        <div class="cap" id="expText"></div>
      </div>
      <div class="cap" id="traits"></div>
    </div>

    <div class="card" id="gameCard">
      <div class="ttl">어느 쪽을 볼까요?</div>
      <div class="game">
        <div class="stage" id="gameArt"></div>
        <div class="pick">
          <button id="gLeft">◀ 왼쪽</button>
          <button id="gRight">오른쪽 ▶</button>
        </div>
      </div>
      <p class="note" id="gameMsg">다섯 번 중 세 번을 맞히면 이겨요.</p>
    </div>

    <div class="card grow">
      <div class="pair">
        <figure><div class="art" id="artNow"></div><figcaption id="capNow">—</figcaption></figure>
        <div class="to">→</div>
        <figure><div class="art next" id="artNext"></div><figcaption id="capNext">—</figcaption></figure>
      </div>
      <p class="note" id="growNote"></p>
      <p class="note" id="growPace"></p>
      <div class="ladder" id="growLadder"></div>
    </div>

    <div class="card">
      <div class="stat" id="s-hunger"><span class="lb">배고픔</span><span class="bar"><i></i></span><span class="pc"></span></div>
      <div class="stat" id="s-fun"><span class="lb">즐거움</span><span class="bar"><i></i></span><span class="pc"></span></div>
      <div class="stat" id="s-energy"><span class="lb">에너지</span><span class="bar"><i></i></span><span class="pc"></span></div>
      <div class="stat" id="s-clean"><span class="lb">청결</span><span class="bar"><i></i></span><span class="pc"></span></div>

      <div class="acts" id="acts">
        <button id="walk">산책</button>
        <button id="train">훈련</button>
        <button id="sleep">재우기</button>
        <button id="clean">치우기</button>
      </div>
      <div class="whyacts" id="whyacts"></div>
      <div class="menu" id="menu"></div>
      <div class="sub" style="margin-top:14px">
        <input type="checkbox" id="chat">
        <span>말 걸기</span>
      </div>
      <div class="sub" style="margin-top:8px">
        <input type="checkbox" id="night">
        <span id="nightLabel">밤에는 재우기</span>
      </div>
      <div class="sub" style="margin-top:8px">
        <input type="checkbox" id="away">
        <span id="awayLabel">자리 비우면 재우기</span>
      </div>
      <div class="sub" style="margin-top:8px">
        <input type="checkbox" id="zoom">
        <span id="zoomLabel">밥·놀기·재주 할 때 가까이 오기</span>
      </div>
      <div class="sub" style="margin-top:8px">
        <input type="checkbox" id="stretch">
        <span id="stretchLabel">오래 앉아 있으면 부르기</span>
      </div>

      <div class="prefs" id="prefsBox">
        <div class="slot"><span class="lb">펫 크기</span>
          <input id="scale" type="range" min="10" max="200" step="1" value="100" aria-label="펫 크기">
          <span class="pcv" id="scaleOut">100%</span>
          <button class="link" id="reset" title="100%로 되돌리기">기본값</button>
        </div>

        <details id="gBox">
          <summary>구글 캘린더 — <span id="gState">확인 중…</span></summary>
          <div id="gSetup">
            <input id="gId" type="text" placeholder="클라이언트 ID" autocomplete="off" spellcheck="false">
            <input id="gSecret" type="password" placeholder="클라이언트 보안 비밀번호" autocomplete="off">
            <button class="link" id="gSave">저장</button>
            <p class="hint">구글 클라우드 콘솔에서 <b>데스크톱 앱</b> 유형으로 만든 값입니다.
              이 값과 로그인 정보는 이 컴퓨터에만 암호화해 저장되고 어디로도 전송되지 않습니다.</p>
          </div>
          <div id="gUseBundled" style="display:none">
            <span>이 앱에는 클라이언트가 내장되어 있습니다.</span>
            <button class="link" id="gBundled">내장 값 사용</button>
          </div>
          <div id="gAuth">
            <button class="link" id="gLogin">구글로 로그인</button>
            <button class="link" id="gLogout" style="display:none">연결 해제</button>
          </div>
          <div id="gOpts" style="display:none">
            <div class="sub"><input type="checkbox" id="cEnabled"><span>일정 알림 켜기</span></div>
            <div class="sub"><span>시작</span>
              <input type="range" id="cLead" min="1" max="60" step="1">
              <span class="pcv" id="cLeadOut">10분</span><span>전에 알림</span></div>
            <div class="sub"><input type="checkbox" id="cBrief"><span>아침에 오늘 일정 브리핑</span>
              <input type="time" id="cBriefAt"></div>
          </div>
        </details>
      </div>
      <div class="tricks" id="tricks"></div>
      <p class="note" id="hint"></p>
      <p class="note" id="metLine"><span id="met"></span>
        <button id="restart" class="link">새 알 받기</button></p>
      <div class="roster" id="roster"></div>
      <div id="family"></div>
      <div id="tree"></div>
      <div id="look"></div>
      <div id="room"></div>
      <div id="badges"></div>
      <div id="missions"></div>
      <div id="log"></div>
    </div>
  </main>

<script src="pixel.js"></script>
<script src="gear.js"></script>
<script src="tint.js"></script>
<script src="species.js"></script>
<script>
(function(){
  "use strict";
  var api = window.care || { onState:function(){}, act:function(){}, ready:function(){},
                             setChat:function(){}, restart:function(){}, setNight:function(){},
                             pick:function(){}, mate:function(){}, game:function(){},
                             rename:function(){}, setAway:function(){}, trick:function(){},
                             setZoom:function(){}, setBadge:function(){},
                             setHome:function(){}, setRoom:function(){} };
  var KEYS = ['hunger','fun','energy','clean'];

  /* ---------- 탭 ----------
   * 창 하나에 다 담았더니 432px 화면에 2,450px 이 들어가 5.7 화면을
   * 스크롤해야 했다. 매번 쓰는 건 위쪽 한 줌뿐인데 나머지가 늘 같이 깔려
   * 있었다.
   *
   * ★마크업을 옮기지 않는다. 구간을 잘라 다른 자리로 옮기다가 사이에 낀
   * 무관한 정의까지 함께 날린 적이 있어서(1.24.0), 여기서는 있는 자리에
   * 그대로 두고 '어느 탭 것인지' 이름표만 붙인다. 숨기는 것은 CSS 가 한다.
   *
   * 고른 탭은 기억한다 — 매번 첫 장으로 돌아가면 이정표를 보러 올 때마다
   * 세 번을 눌러야 한다. */
  var TABS = [['care', '돌보기'], ['grow', '성장'], ['family', '가족'],
              ['room', '꾸미기'], ['prefs', '설정']];

  /* 무엇이 어느 탭인지. 왼쪽은 선택자, 오른쪽은 탭.
     여기 없는 것은 어느 탭에서나 보인다(이름·나이 줄처럼). */
  var WHERE = [
    ['#gameCard', 'care'], ['#s-hunger', 'care'], ['#s-fun', 'care'],
    ['#s-energy', 'care'], ['#s-clean', 'care'], ['#acts', 'care'],
    ['#menu', 'care'], ['#tricks', 'care'], ['#hint', 'care'],
    ['.card.grow', 'grow'], ['#missions', 'grow'], ['#log', 'grow'],
    ['#metLine', 'family'], ['#roster', 'family'], ['#family', 'family'],
    ['#tree', 'family'],
    ['#look', 'room'], ['#room', 'room'], ['#badges', 'room'],
    ['#prefsBox', 'prefs']
  ];

  var tabKey = 'moka.care.tab';
  var current = 'care';
  try { current = localStorage.getItem(tabKey) || 'care'; } catch (e) {}
  if (!TABS.some(function(t){ return t[0] === current; })) current = 'care';

  function tagTabs(){
    WHERE.forEach(function(row){
      var el = document.querySelector(row[0]);
      if (el) el.setAttribute('data-tabof', row[1]);
    });
    // 설정 체크박스 다섯 줄은 id 가 없다 — 전부 설정 탭이다
    Array.prototype.forEach.call(document.querySelectorAll('main .sub'), function(el){
      el.setAttribute('data-tabof', 'prefs');
    });
  }

  function showTab(key, scroll){
    current = key;
    try { localStorage.setItem(tabKey, key); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('[data-tabof]'), function(el){
      el.toggleAttribute('data-hide', el.getAttribute('data-tabof') !== key);
    });
    /* 속이 전부 숨겨진 카드는 빈 껍데기만 남는다 — 카드째 접는다.
       ★제 이름표를 단 카드는 건드리지 않는다. 위에서 이미 정해 놨는데
       여기서 다시 손대면 방금 숨긴 것을 도로 켜 버린다(성장 카드와 게임
       카드가 모든 탭에 남아 있던 이유). */
    Array.prototype.forEach.call(document.querySelectorAll('main .card'), function(card){
      if (card.hasAttribute('data-tabof')) return;
      var kids = Array.prototype.slice.call(card.children);
      var tagged = kids.filter(function(k){ return k.hasAttribute('data-tabof'); });
      var alive = kids.some(function(k){
        return !k.hasAttribute('data-tabof') ? hasInk(k) : !k.hasAttribute('data-hide');
      });
      card.toggleAttribute('data-hide', tagged.length > 0 && !alive);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
      b.setAttribute('aria-selected', String(b.getAttribute('data-go') === key));
    });
    // 위로 올리는 것은 사람이 탭을 눌렀을 때만. 1분마다 오는 상태 갱신에도
    // 올려 버리면 읽던 자리를 계속 빼앗긴다.
    if (scroll) { var m = document.querySelector('main'); if (m) m.scrollTop = 0; }
  }

  // 이름표가 없는 조각이라도 실제로 그려진 것이 없으면 카드를 살려 둘 이유가 없다
  function hasInk(el){
    if (el.hasAttribute('hidden')) return false;
    return (el.textContent || '').trim().length > 0 || el.querySelector('svg,img,input,button');
  }

  function buildTabs(){
    var nav = document.getElementById('tabs');
    if (!nav) return;
    nav.innerHTML = TABS.map(function(t){
      return '<button data-go="' + t[0] + '">' + t[1] + '</button>';
    }).join('');
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){ showTab(b.getAttribute('data-go'), true); });
    });
  }

  /* ---------- 툴팁 ----------
   * 왜 못 하는지는 비활성 버튼에 달려 있는데, 비활성 버튼은 마우스
   * 이벤트를 받지 않아 브라우저가 툴팁을 띄우지 못한다. pointer-events 를
   * 꺼 이벤트를 통과시키고, 커서 아래에 있는 것을 자리로 찾아 직접 그린다.
   * (통과시키면 elementFromPoint 도 그 버튼을 돌려주지 않는다.) */
  var tip = document.getElementById('tip');
  var tipFor = null;

  function whyAt(x, y){
    var found = null;
    Array.prototype.forEach.call(document.querySelectorAll('[data-why]'), function(el){
      if (el.closest('[data-hide]')) return;
      var r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) found = el;
    });
    return found;
  }

  function moveTip(e){
    var el = whyAt(e.clientX, e.clientY);
    if (!el) { tip.classList.remove('on'); tipFor = null; return; }
    if (el !== tipFor) { tip.textContent = el.getAttribute('data-why'); tipFor = el; }
    tip.classList.add('on');
    // 커서 아래에 붙이되 창 밖으로 나가지 않게
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(e.clientX + 12, innerWidth - w - 6);
    var y = e.clientY + 18;
    if (y + h > innerHeight - 4) y = e.clientY - h - 10;
    tip.style.left = Math.max(4, x) + 'px';
    tip.style.top = Math.max(4, y) + 'px';
  }
  document.addEventListener('mousemove', moveTip);
  document.addEventListener('mouseleave', function(){ tip.classList.remove('on'); tipFor = null; });

  /* ---------- 설정 (옛 「모카펫 설정」 창) ----------
   * 창을 없애고 이리로 옮겼다. 아래 코드는 settings.html 에서 그대로
   * 가져온 것이다 — 다시 쓰면 로그인 흐름 같은 데서 미묘하게 어긋난다. */
  var slider = document.getElementById('scale');
  var out    = document.getElementById('scaleOut');
  var reset  = document.getElementById('reset');

  function paint(){
    var min = +slider.min, max = +slider.max, v = +slider.value;
    out.textContent = v + '%';
    slider.style.setProperty('--p', (v - min) / (max - min));
  }

  function push(){
    paint();
    api.setPct(+slider.value);
  }

  api.onState(function(cfg){
    if(!cfg) return;
    if(cfg.min) slider.min = cfg.min;
    if(cfg.max) slider.max = cfg.max;
    slider.value = cfg.pct || 100;
    paint();
  });

  // live while dragging, so the pet resizes under the cursor
  slider.addEventListener('input', push);

  // Shift+arrow for a coarser step; the browser only gives us 1 by default
  slider.addEventListener('keydown', function(e){
    if(!e.shiftKey) return;
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 10
          : (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') ? -10 : 0;
    if(!d) return;
    e.preventDefault();
    slider.value = Math.max(+slider.min, Math.min(+slider.max, +slider.value + d));
    push();
  });

  reset.addEventListener('click', function(){
    slider.value = 100;
    push();
  });

  /* ---------- google calendar ---------- */
  var gState  = document.getElementById('gState');
  var gSetup  = document.getElementById('gSetup');
  var gOpts   = document.getElementById('gOpts');
  var gId     = document.getElementById('gId');
  var gSecret = document.getElementById('gSecret');
  var gSave   = document.getElementById('gSave');
  var gLogin  = document.getElementById('gLogin');
  var gLogout = document.getElementById('gLogout');

  var cEnabled = document.getElementById('cEnabled');
  var cLead    = document.getElementById('cLead');
  var cLeadOut = document.getElementById('cLeadOut');
  var cBrief   = document.getElementById('cBrief');
  var cBriefAt = document.getElementById('cBriefAt');

  function paintGoogle(cfg){
    if(!cfg) return;
    if(cfg.version) document.getElementById('ver').textContent = 'v' + cfg.version;
    if(!cfg.google) return;
    var g = cfg.google, c = cfg.cal || {};

    if(!g.canStore){
      gState.textContent = '이 시스템에서는 자격증명을 안전하게 저장할 수 없습니다';
      gState.className = 'state bad';
      gSetup.style.display = 'none';
      document.getElementById('gAuth').style.display = 'none';
      return;
    }

    // a bundled client means the teammate never needs to see these fields
    gSetup.style.display = (g.bundled || (g.hasClient && g.signedIn)) ? 'none' : '';
    // an override is in play even though the build ships a client — offer a way back
    document.getElementById('gUseBundled').style.display =
      (g.hasBundled && !g.bundled && !g.signedIn) ? '' : 'none';
    gLogin.style.display  = g.signedIn ? 'none' : '';
    gLogout.style.display = g.signedIn ? '' : 'none';
    gLogin.disabled = !g.hasClient;
    gOpts.style.display = g.signedIn ? '' : 'none';

    if(g.signedIn){
      gState.textContent = g.email ? ('연결됨 · ' + g.email) : '연결됨';
      gState.className = 'state ok';
    } else if(g.hasClient){
      gState.textContent = '로그인하면 연결됩니다';
      gState.className = 'state';
    } else {
      gState.textContent = '클라이언트 값을 입력해 주세요';
      gState.className = 'state';
    }

    cEnabled.checked = c.enabled !== false;
    cLead.value = c.leadMinutes || 10;
    cLeadOut.textContent = cLead.value + '분';
    cBrief.checked = !!c.briefEnabled;
    cBriefAt.value = c.briefAt || '09:00';
  }

  function busy(el, on, label){
    el.disabled = on;
    if(on){ el.dataset.label = el.textContent; el.textContent = label; }
    else if(el.dataset.label){ el.textContent = el.dataset.label; }
  }

  gSave.addEventListener('click', function(){
    api.googleSetClient(gId.value, gSecret.value).then(function(cfg){
      gSecret.value = '';
      paintGoogle(cfg);
    });
  });

  gLogin.addEventListener('click', function(){
    busy(gLogin, true, '브라우저에서 진행 중…');
    gState.textContent = '브라우저에서 구글 로그인을 마쳐 주세요';
    gState.className = 'state';
    api.googleSignIn().then(function(cfg){
      busy(gLogin, false);
      paintGoogle(cfg);
    }).catch(function(err){
      busy(gLogin, false);
      gState.textContent = (err && err.message ? String(err.message).replace(/^Error: /, '') : '로그인하지 못했습니다');
      gState.className = 'state bad';
    });
  });

  document.getElementById('gBundled').addEventListener('click', function(){
    api.googleSetClient('', '').then(paintGoogle);
  });

  gLogout.addEventListener('click', function(){
    api.googleSignOut().then(paintGoogle);
  });

  cEnabled.addEventListener('change', function(){ api.calSet({ enabled: cEnabled.checked }); });
  cBrief.addEventListener('change', function(){ api.calSet({ briefEnabled: cBrief.checked }); });
  cBriefAt.addEventListener('change', function(){ api.calSet({ briefAt: cBriefAt.value }); });
  cLead.addEventListener('input', function(){ cLeadOut.textContent = cLead.value + '분'; });
  cLead.addEventListener('change', function(){ api.calSet({ leadMinutes: +cLead.value }); });

  api.onState(paintGoogle);
  if(api.googleStatus) api.googleStatus().then(paintGoogle);


  // ⌘, 로 열면 설정 탭으로 바로 간다
  if (api.onTab) api.onTab(function(t){ showTab(t, true); });

  tagTabs();
  buildTabs();
  showTab(current);

  /* ---------- what it looks like now, and what comes next ----------
     The next stage is drawn from the same sprite the pet will actually
     become, blacked out — a silhouette of the real thing, not a guess. */
  function spriteFor(species, stage, pet, k, build){
    var sp = window.SPECIES.get(species);
    var art = (stage === 'egg')
      ? window.SPECIES.eggMarkup(false)
      : window.SPECIES.at(species, stage, build).markup();
    // stages differ in size, so the view box zooms out for the small ones
    // exactly as the window does in the real thing. The factors come from
    // care.js with the state, so there is only ever one copy of them.
    k = k || 1;
    var w = 280 / k, h = 300 / k;
    var vb = (-20 - (w - 280) / 2) + ' ' + (-40 - (h - 300)) + ' ' + w + ' ' + h;
    return '<svg viewBox="' + vb + '" style="' + window.TINT.css(pet || {}, sp) + '">' + art + '</svg>';
  }

  function label(stage, title, from, age){
    if (stage === 'egg') return '알';
    return title + ' · ' + (age !== undefined ? age : from) + '살';
  }

  function drawGrowth(c){
    var pet = c.pet || {};
    var sc = c.scale || {};
    // the shell is neutral: its colour would hint at who is inside
    var nowPet = c.egg ? { fur: '#CFC3AB', belly: '#EFE7D6' } : pet;
    document.getElementById('artNow').innerHTML = spriteFor(c.species, c.stage, nowPet, sc.now, c.build);
    document.getElementById('capNow').textContent =
      c.egg ? '알' : label(c.stage, c.title, null, c.age);

    var next = c.next;
    var nextArt = document.getElementById('artNext');
    var nextCap = document.getElementById('capNext');
    var note = document.getElementById('growNote');
    if (!next){
      nextArt.innerHTML = '';
      nextArt.classList.remove('next');
      nextArt.classList.remove('mystery');
      nextCap.textContent = '마지막 단계';
      note.textContent = '더 자랄 곳이 없어요. 오래오래 함께 지내요.';
      drawPace(c);
      return;
    }
    nextArt.classList.add('next');
    if (c.egg){
      nextArt.classList.add('mystery');
      nextArt.innerHTML = '';
    } else {
      nextArt.classList.remove('mystery');
      nextArt.innerHTML = spriteFor(c.species, next.stage, pet, sc.next, c.build);
    }
    nextCap.textContent = label(next.stage, next.title, next.from);
    note.textContent = c.egg
      ? '알에서 깨어나면 아기가 돼요.'
      : (next.from + '살이 되면 ' + next.title + (next.ro || '로') + ' 자라요.');
    drawPace(c);
  }

  /* 얼마나 남았는지. "다음 나이까지 N/M" 은 경험치 줄에 이미 있지만,
     정작 궁금한 것은 "다음 칭호까지 며칠"이다 — 앱 안에서는 알 길이
     없어서 사람에게 물어봐야 했다.
     ★'이 속도면'은 짐작이 아니라 지난 며칠간 실제로 오른 경험치의
     평균이다. 재 본 날이 없으면 아는 척하지 않는다. */
  function drawPace(c){
    var el = document.getElementById('growPace');
    var lad = document.getElementById('growLadder');
    var t = c.toNext;
    if (!t){ el.textContent = ''; lad.innerHTML = ''; }
    else {
      var line = '다음 칭호 「' + t.title + '」까지 경험치 ' + t.exp.toLocaleString();
      if (t.days) line += '   ·   요즘 속도(하루 ' + t.pace + ')면 ' + t.days + '일쯤';
      else line += '   ·   며칠 더 지내 보면 얼마나 걸릴지 알려드릴게요';
      el.textContent = line;
    }
    var rows = c.ladder || [];
    var passed = true;
    lad.innerHTML = rows.map(function(r, i){
      var cls = r.now ? 'on' : (passed ? 'past' : '');
      if (r.now) passed = false;
      return (i ? '<i>›</i>' : '') + '<span class="' + cls + '">' + r.title + '</span>';
    }).join('');
  }

  /* Everyone in the cast. Met pets show as themselves at the age they
     are; the rest are silhouettes — you know who exists, not which egg
     you are holding. Clicking a met pet brings it to the desk. */
  function drawRoster(list){
    var host = document.getElementById('roster');
    if(!list || !list.length){ host.innerHTML = ''; return; }
    host.innerHTML = '';
    list.forEach(function(r){
      var b = document.createElement('button');
      b.className = (r.met ? 'met ' : '') + (r.here ? 'here' : '');
      var art = r.met
        ? spriteFor(r.species || r.key, r.stage, { fur: r.fur, belly: r.belly }, r.scale, r.build)
        : spriteFor(r.species || r.key, 'adult', { fur: r.fur, belly: r.belly }, 1);
      b.innerHTML = '<span class="slot">' + art + '</span>' +
                    '<span class="nm">' + (r.met ? r.name : '???') + '</span>';
      if(r.met && !r.here) b.addEventListener('click', function(){ api.pick(r.key); });
      host.appendChild(b);
    });
  }

  /* Who this particular pet turned into: what it weighs, what it is like,
     and what you have taught it. */
  function drawTraits(c){
    var host = document.getElementById('traits');
    if (c.egg) { host.innerHTML = ''; return; }
    var bits = [];
    bits.push('<span class="tag">무게 <b>' + c.weight + 'kg</b> · ' + c.buildLabel + '</span>');
    bits.push('<span class="tag">성격 <b>' +
              (c.personality || '아직 몰라요') + '</b></span>');
    // say what the personality and build actually do, or they read as decoration
    if (c.natureNote) bits.push('<span class="tag why">' + c.natureNote + '</span>');
    var learned = (c.tricks || []).length;
    bits.push('<span class="tag">재주 <b>' + learned + ' / ' + c.trickTotal + '</b>' +
              (learned ? ' · ' + c.tricks.join(', ') : '') + '</span>');
    if ((c.bornWith || []).length) {
      bits.push('<span class="tag">부모에게 물려받은 재주 <b>' + c.bornWith.join(', ') + '</b></span>');
    }
    host.innerHTML = bits.join('');
  }

  /* Two grown pets make a third. The child is a new member of the family,
     not a replacement for either of them. */
  function drawFamily(c){
    var host = document.getElementById('family');
    if (c.egg) { host.innerHTML = ''; return; }

    var out = '';
    if (c.parents) {
      out += '<div class="ttl">부모 · ' + c.parents[0] + ' × ' + c.parents[1] + '</div>';
    }
    out += '<div class="ttl">짝짓기</div>';
    if (c.myMate) {
      out += '<div class="none">이미 ' + c.myMate + '와 짝이에요 \u2005·\u2005 다른 아이와는 맺어지지 않아요</div>';
    }
    if (c.full) {
      out += '<div class="none">식구가 가득 찼어요</div>';
    } else if (c.mateBlocked) {
      out += '<div class="none">' + c.name + '\u2005·\u2005' + c.mateBlocked + '</div>';
    } else if (!c.mates || !c.mates.length) {
      out += '<div class="none">함께할 어른이 아직 없어요</div>';
    } else {
      // everyone is listed; the ones that cannot say why
      out += '<div class="mates">' + c.mates.map(function(m){
        return '<button data-mate="' + m.id + '"' + (m.no ? ' disabled' : '') + '>' +
               m.name + (m.no ? '\u2005·\u2005' + m.no : '와 짝짓기') + '</button>';
      }).join('') + '</div>';
    }
    host.innerHTML = out;
    Array.prototype.forEach.call(host.querySelectorAll('[data-mate]'), function(b){
      b.addEventListener('click', function(){ api.mate(b.getAttribute('data-mate')); });
    });
  }

  /* ---------- the guessing game ----------
     Five rounds. You call a side, the pet turns; three right wins. The
     pet on screen is the real one, at its real age and build. */
  var game = { round: 0, wins: 0, busy: false, sprite: '', over: false };

  function gameFace(dir){
    document.getElementById('gameArt').className = 'stage ' + dir;
  }

  function resetGame(c){
    game = { round: 0, wins: 0, busy: false, over: false,
             sprite: spriteFor(c.species, c.stage, c.pet || {}, 1, c.build) };
    document.getElementById('gameArt').innerHTML = game.sprite;
    gameFace('right');
    document.getElementById('gameMsg').textContent = '다섯 번 중 세 번을 맞히면 이겨요.';
  }

  function drawGame(c){
    var card = document.getElementById('gameCard');
    if (c.egg) { card.style.display = 'none'; return; }
    card.style.display = '';
    if (!game.sprite) resetGame(c);

    var stop = game.busy || game.over || !c.canGame;
    ['gLeft','gRight'].forEach(function(id){
      document.getElementById(id).disabled = stop;
    });
    if (!c.canGame && !game.over && !game.busy) {
      document.getElementById('gameMsg').textContent = c.gameBlocked || '';
    }
  }

  function playRound(guess){
    if (game.busy || game.over) return;
    game.busy = true;
    var turned = Math.random() < 0.5 ? 'left' : 'right';
    var msg = document.getElementById('gameMsg');
    msg.textContent = '…';
    document.getElementById('gameArt').className = 'stage';   // face front first
    setTimeout(function(){
      gameFace(turned);
      game.round += 1;
      var hit = turned === guess;
      if (hit) game.wins += 1;
      msg.textContent = (hit ? '맞췄어요!' : '아깝다!') +
                        '  ' + game.wins + ' / ' + game.round;
      game.busy = false;
      if (game.round >= 5) {
        game.over = true;
        var won = game.wins >= 3;
        msg.textContent = won ? ('이겼어요! ' + game.wins + ' / 5')
                              : ('졌어요… ' + game.wins + ' / 5');
        api.game(won);
        setTimeout(function(){ game.sprite = ''; }, 1600);   // next open starts fresh
      }
      drawGame(lastState || {});
    }, 420);
  }

  ['gLeft','gRight'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(){
      playRound(id === 'gLeft' ? 'left' : 'right');
    });
  });

  /* ---------- the family tree ----------
     Two parents to a child means it is not a tree in the strict sense, so
     it is drawn as what it is: pairs, and who came of them. */
  function drawTree(list){
    var host = document.getElementById('tree');
    var kids = (list || []).filter(function(r){ return r.parents && r.parents.length === 2; });
    if (!kids.length) { host.innerHTML = ''; return; }
    var by = {};
    (list || []).forEach(function(r){ by[r.key] = r; });

    function chip(r, known){
      if (!r) return '<span class="who">?</span>';
      var art = known
        ? spriteFor(r.species || r.key, r.stage, { fur: r.fur, belly: r.belly }, r.scale, r.build)
        : '';
      return '<span class="who"><i>' + art + '</i>' + (known ? r.name : '알') + '</span>';
    }

    host.innerHTML = '<div class="ttl">가계도</div>' + kids.map(function(k){
      return '<div class="line">' +
        chip(by[k.parents[0]], true) + '<span class="arrow">×</span>' +
        chip(by[k.parents[1]], true) + '<span class="arrow">→</span>' +
        chip(k, k.met) + '</div>';
    }).join('');
  }

  /* ---------- naming ----------
     Click the pencil, type, Enter. Escape puts it back. */
  var editing = false;
  function startRename(current){
    if (editing) return;
    editing = true;
    var host = document.querySelector('.who');
    var span = document.getElementById('name');
    var input = document.createElement('input');
    input.className = 'nameEdit';
    input.value = current || '';
    input.maxLength = 12;
    span.style.display = 'none';
    document.getElementById('rename').style.display = 'none';
    host.insertBefore(input, span);
    input.focus();
    input.select();

    function done(save){
      if (!editing) return;
      editing = false;
      var v = input.value.trim();
      input.remove();
      span.style.display = '';
      document.getElementById('rename').style.display = '';
      if (save && v && v !== current) api.rename(v);
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') done(true);
      else if (e.key === 'Escape') done(false);
    });
    input.addEventListener('blur', function(){ done(true); });
  }

  document.getElementById('rename').addEventListener('click', function(){
    if (lastState && !lastState.egg) startRename(lastState.name);
  });

  /* ---------- the record ---------- */
  function ago(t){
    var d = Math.floor((Date.now() - t) / 86400000);
    if (d <= 0) return '오늘';
    if (d === 1) return '어제';
    if (d < 30) return d + '일 전';
    return Math.floor(d / 30) + '달 전';
  }

  function drawLog(c){
    var host = document.getElementById('log');
    var list = c.log || [];
    if (c.egg || !list.length) { host.innerHTML = ''; return; }
    var born = c.bornAt ? '<div class="ttl">기록 · ' + ago(c.bornAt) + '에 태어났어요</div>'
                        : '<div class="ttl">기록</div>';
    host.innerHTML = born + '<ul>' + list.map(function(e){
      return '<li><b>' + ago(e.t) + '</b><span>' + e.text + '</span></li>';
    }).join('') + '</ul>';
  }

  /* One button per trick it actually knows — pressing it makes the pet do
     the thing, out on the desk. */
  function drawTricks(c){
    var host = document.getElementById('tricks');
    var list = (c.tricks || []);
    if (c.egg || !list.length) { host.innerHTML = ''; return; }
    // Say what a performance is worth, or nobody would know the repertoire
    // matters — and say when it has stopped being worth anything.
    var v = c.show || {};
    // 못 하는 이유는 care.js 가 판단한다. 여기에 기력 문턱을 다시 적어
    // 두었더니, 같은 조건을 안 적은 트레이 메뉴만 열려 있었다.
    var no = (c.blocked || {}).show;
    var note = no ? no
             : !v.keen ? '지금은 신나 있어서 해도 경험치는 안 올라요'
             : '한 번에 경험치 +' + v.exp + ' · 즐거움 +' + v.fun +
               (v.known < 10 ? '   (재주가 늘수록 더 커져요)' : '');
    // 시들한 상태는 '못 하는' 것이 아니라 '해도 안 오르는' 것이다 —
    // 잠그지 않고 눌렀을 때 헛일이 아님을 말해 준다.
    var tip = no || (!v.keen ? '지금은 신나 있어서 경험치는 안 올라요' : '');
    host.innerHTML = '<div class="worth">' + note + '</div>' + list.map(function(t){
      return '<button data-trick="' + t + '"' + (no ? ' disabled' : '') +
             (tip ? ' title="' + tip + '"' : '') + '>' + t + '</button>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('[data-trick]'), function(b){
      b.addEventListener('click', function(){ api.trick(b.getAttribute('data-trick')); });
    });
  }

  /* The menu. A dish it has learned to love is marked, and the one it just
     had is dimmed — the same dish twice running is only half as good, and
     saying so is better than letting people wonder why the bar moved less. */
  function drawMenu(c){
    var host = document.getElementById('menu');
    if (c.egg) { host.innerHTML = ''; return; }

    function course(label, list, fav, last, act, full, done){
      var btns = list.map(function(f){
        var cls = [];
        if (f.lock) cls.push('locked');
        else {
          if (f.id === fav) cls.push('fav');
          if (f.id === last) cls.push('again');
        }
        // 잠긴 것은 무엇을 해야 열리는지, 지금 안 되는 것은 왜 안 되는지.
        // 올려두면 말해 준다.
        var tip = f.lock ? (f.label + (f.neun || '은') + ' ' + label + ' ' +
                            f.need + '번 (' + done + '/' + f.need + ')')
                         : (full || '');
        return '<button data-eat="' + act + ':' + f.id + '"' +
               (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
               (tip ? ' title="' + tip + '" data-why="' + tip + '"' : '') +
               ((full || f.lock) ? ' disabled' : '') + '>' +
               f.label + (f.lock ? ' 🔒' : '') + '</button>';
      }).join('');

      // the next thing you would learn, and how far off it is
      var next = null;
      list.forEach(function(f){ if (f.lock && (!next || f.need < next.need)) next = f; });

      // 놀기는 먹는 것이 아니다 — 같은 규칙이라고 같은 말을 쓸 수는 없다
      var play = act === 'play';
      var taste = play ? '좋아하는 놀이' : '입맛';
      // full 은 이제 care.js 가 준 '거절 이유' 자체다. 여기서 다시
      // 판단하지 않으므로 놀이마다 다른 소모량 같은 것도 저절로 맞는다.
      var why;
      if (full) why = full;
      else if (fav) why = taste + ' · ' + (list.filter(function(f){ return f.id === fav; })[0] || {}).label +
                          '   ·   같은 걸 연달아 ' + (play ? '하면' : '주면') + ' 시들해져요';
      else why = '여러 가지를 ' + (play ? '해보면 좋아하는 놀이가' : '먹여 보면 입맛이') + ' 생겨요';
      if (next) why += '   ·   ' + next.label + (next.neun || '은') + ' ' + label + ' ' +
                       next.need + '번 (' + done + '/' + next.need + ')';

      return '<div class="course"><span class="lb">' + label + '</span>' + btns +
             '<span class="why">' + why + '</span></div>';
    }

    var n = c.cooked || { meals: 0, snacks: 0, plays: 0 };
    var no = c.blocked || {};
    host.innerHTML =
      course('밥',   c.meals  || [], c.favMeal,  c.lastMeal,  'feed',  no.feed,  n.meals) +
      course('간식', c.snacks || [], c.favSnack, c.lastSnack, 'snack', no.snack, n.snacks) +
      course('놀기', c.plays  || [], c.favPlay,  c.lastPlay,  'play',  no.play,  n.plays);

    Array.prototype.forEach.call(host.querySelectorAll('[data-eat]'), function(b){
      b.addEventListener('click', function(){
        var v = b.getAttribute('data-eat').split(':');
        api.act(v[0], v[1]);
      });
    });
  }

  /* Four slots, the same ones the tray menu offers, but here where you can
     see the pet you are decorating around. Locked items are simply absent —
     main.js filters them before they ever reach this window. */
  function drawRoom(c){
    var host = document.getElementById('room');
    if (c.egg || !c.room) { host.innerHTML = ''; return; }
    var slots = (c.room.slots || []).map(function(s){
      // prizes are listed even when locked, greyed out with the milestone
      // that hands them over — hiding them hid that there was anything to
      // work towards
      var opts = [['없음','none']].concat(s.items).map(function(o){
        return '<option value="' + o[1] + '"' +
               (o[2] ? ' disabled' : '') +
               (c.room.choice[s.slot] === o[1] ? ' selected' : '') + '>' +
               o[0] + (o[2] ? ' — 「' + o[2] + '」' : '') + '</option>';
      }).join('');
      return '<div class="slot"><span class="lb">' + s.label + '</span>' +
             '<select data-room="' + s.slot + '">' + opts + '</select></div>';
    }).join('');
    host.setAttribute('data-off', c.home ? '0' : '1');
    host.innerHTML =
      '<div class="ttl">집 꾸미기</div>' +
      '<label class="on"><input type="checkbox" id="homeOn"' + (c.home ? ' checked' : '') + '>' +
      '<span>집에서 지내기 — 창이 넓어지고 제자리에 머뭅니다</span></label>' +
      slots +
      '<div class="hint">' + (c.home
        ? '고른 것은 이 아이의 집에만 남습니다.'
        : '집에서 지내기를 켜야 화면에 나옵니다.') + '</div>';

    document.getElementById('homeOn').addEventListener('change', function(){
      api.setHome(this.checked);
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-room]'), function(sel){
      sel.addEventListener('change', function(){
        api.setRoom(sel.getAttribute('data-room'), sel.value);
      });
    });
  }

  /* Quiet: a list you can look at, never a nag. Undone ones show what
     they would give, so the prize is the reason rather than a score. */
  function drawMissions(c){
    var host = document.getElementById('missions');
    var list = c.missions || [];
    if (c.egg || !list.length) { host.innerHTML = ''; return; }
    var got = list.filter(function(m){ return m.done; }).length;
    var rows = list.map(function(m){
      // 받은 상품은 '어디에 있는지'까지 말해 준다. 이름만 보고는 트레이의
      // 소품인지 집 꾸미기의 물건인지 알 수 없어 찾아 헤매게 된다.
      var spots = (m.prizes || []).map(function(p){ return p.label + ' → ' + p.where; }).join('\n');
      var tail;
      if (m.done) {
        tail = '<span class="pz"' + (spots ? ' title="' + spots + '" data-why="' + spots + '"' : '') + '>' +
               m.prize + '</span>' +
               (m.prizes && m.prizes.length
                 ? '<span class="pzat">' +
                   m.prizes.map(function(p){ return p.where; })
                     .filter(function(v, i, a){ return a.indexOf(v) === i; }).join(' · ') +
                   '</span>'
                 : '');
      } else if (typeof m.goal === 'number') {
        var pct = Math.round(Math.min(1, (m.now || 0) / m.goal) * 100);
        tail = '<span class="at"><b>' + (m.now || 0) + '</b> / ' + m.goal + (m.unit || '') + '</span>' +
               '<span class="bar"><i style="width:' + pct + '%"></i></span>';
      } else {
        tail = '<span class="pz">' + m.how + '</span>';
      }
      return '<li class="' + (m.done ? 'on' : '') + '" title="' + m.how + '">' +
               '<span class="mk">' + (m.done ? '\u2714' : '\u25cb') + '</span>' +
               '<span class="nm">' + m.title + '</span>' + tail +
             '</li>';
    }).join('');
    host.innerHTML = '<div class="ttl">이정표 ' + got + ' / ' + list.length + '</div>' +
                     '<ul>' + rows + '</ul>';
  }

  /* ---------- 꾸미기 ----------
   * 털 색·소품·대표 칭호는 트레이의 오른쪽 클릭 메뉴에 있었다. 고르는
   * 곳이 두 군데면 한쪽만 고쳐 놓고 지나가게 되고, 무엇보다 이정표로 받은
   * 상품을 "집 꾸미기 · 좌우 소품" 이라고 알려 줘 놓고 정작 고르는 자리는
   * 다른 창에 있었다. 한자리에 모은다. */
  function drawLook(c){
    var host = document.getElementById('look');
    if (c.egg || !c.gear) { host.innerHTML = ''; return; }

    var furs = (c.furs || []).map(function(f){
      var on = String(c.fur).toLowerCase() === String(f[1]).toLowerCase();
      return '<button type="button" class="sw' + (on ? ' on' : '') + '" data-fur="' + f[1] +
             '" title="' + f[0] + '" style="background:' + f[1] + '"></button>';
    }).join('');

    var eyes = (c.eyesList || []).map(function(e){
      return '<button type="button" class="chip' + (c.eyesPick === e[1] ? ' on' : '') +
             '" data-eyes="' + e[1] + '">' + e[0] + '</button>';
    }).join('');

    var slots = (c.gear.slots || []).map(function(s){
      var opts = [['없음', 'none']].concat(s.items).map(function(o){
        return '<option value="' + o[1] + '"' +
               (o[2] ? ' disabled' : '') +
               (c.gear.choice[s.slot] === o[1] ? ' selected' : '') + '>' +
               o[0] + (o[2] ? ' — 「' + o[2] + '」' : '') + '</option>';
      }).join('');
      return '<div class="slot"><span class="lb">' + s.label + '</span>' +
             '<select data-prop="' + s.slot + '">' + opts + '</select></div>';
    }).join('');

    host.innerHTML =
      '<div class="ttl">꾸미기</div>' +
      '<div class="slot"><span class="lb">털 색</span><span class="sws">' + furs + '</span></div>' +
      '<div class="slot"><span class="lb">눈</span><span class="sws">' + eyes + '</span></div>' +
      slots +
      '<button type="button" class="link" id="bare">소품 모두 벗기기</button>';

    Array.prototype.forEach.call(host.querySelectorAll('[data-fur]'), function(b){
      b.addEventListener('click', function(){ api.setFur(b.getAttribute('data-fur')); });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-eyes]'), function(b){
      b.addEventListener('click', function(){ api.setEyes(b.getAttribute('data-eyes')); });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-prop]'), function(sel){
      sel.addEventListener('change', function(){
        api.setProp(sel.getAttribute('data-prop'), sel.value);
      });
    });
    var bare = document.getElementById('bare');
    if (bare) bare.addEventListener('click', function(){ api.clearProps(); });
  }

  function drawBadges(c){
    var host = document.getElementById('badges');
    if (c.egg || !(c.badges || []).length) { host.innerHTML = ''; return; }
    host.innerHTML =
      '<div class="badges"><div class="pick">딴 칭호 — 하나를 고르면 말풍선과 이름 옆에 붙습니다</div>' +
      c.badges.map(function(b){
        return '<button type="button" data-badge="' + b.id + '"' +
               (b.id === c.badgeId ? ' class="on"' : '') + '>' + b.name + '</button>';
      }).join('') +
      '<button type="button" class="none' + (c.badgeId ? '' : ' on') + '" data-badge="">안 달기</button>' +
      '</div>';
    Array.prototype.forEach.call(host.querySelectorAll('[data-badge]'), function(b){
      b.addEventListener('click', function(){ api.setBadge(b.getAttribute('data-badge')); });
    });
  }

  function setNightUI(c){
    document.getElementById('night').checked = c.night !== false;
    if (c.nightFrom !== undefined) {
      document.getElementById('nightLabel').textContent =
        '밤에는 재우기 (' + c.nightFrom + '시~' + c.nightTo + '시)';
    }
    document.getElementById('away').checked = c.away !== false;
    if (c.awayMin !== undefined) {
      document.getElementById('awayLabel').textContent =
        '자리 비우면 재우기 (' + c.awayMin + '분)';
    }
    document.getElementById('zoom').checked = c.zoom !== false;
    // when the pet is already big the setting does nothing, and saying so
    // is better than leaving a checkbox that has no effect
    document.getElementById('zoomLabel').textContent =
      (c.zoomFactor && c.zoomFactor > 1.01)
        ? '밥·놀기·재주 할 때 가까이 오기 (' + c.zoomFactor.toFixed(1) + '배)'
        : '밥·놀기·재주 할 때 가까이 오기 (지금 크기면 그대로)';
  }

  function setStat(key, v){
    var el = document.getElementById('s-' + key);
    el.className = 'stat' + (v < 25 ? ' low' : (v < 55 ? ' mid' : ''));
    el.querySelector('i').style.width = v + '%';
    el.querySelector('.pc').textContent = v + '%';
  }

  var lastState = null;
  api.onState(function(c){
    if(!c) return;
    lastState = c;
    if(c.version) document.getElementById('ver').textContent = 'v' + c.version;
    if (!editing) document.getElementById('name').textContent = c.egg ? '알' : (c.name || '');
    document.getElementById('rename').style.display = c.egg ? 'none' : '';
    drawGrowth(c);

    drawRoster(c.roster);
    drawGame(c);
    drawTree(c.roster);
    drawFamily(c);
    drawMenu(c);
    drawRoom(c);
    drawLook(c);
    drawBadges(c);
    drawMissions(c);
    drawLog(c);
    var met = document.getElementById('met');
    var restart = document.getElementById('restart');
    if (c.total) met.textContent = '만난 친구 ' + c.met + ' / ' + c.total + '   ·   ';
    restart.disabled = !c.left;
    restart.textContent = c.left ? ('새 알 받기 (' + c.left + '마리 남음)') : '모두 만났어요';

    // An egg has no stats and no age — it has a hatching bar and one
    // thing you can do for it.
    if(c.egg){
      document.getElementById('age').textContent = '누가 나올까요';
      document.getElementById('expBar').style.width = (c.hatch || 0) + '%';
      document.getElementById('expText').textContent =
        '부화까지 ' + (c.hatch || 0) + '%   ·   쓰다듬으면 빨리 깨어나요';
      KEYS.forEach(function(k){ setStat(k, 0); });
      ['walk','train','sleep','clean'].forEach(function(k){
        document.getElementById(k).disabled = true;
      });
      document.getElementById('traits').innerHTML = '';
      document.getElementById('tricks').innerHTML = '';
      document.getElementById('gameCard').style.display = 'none';
      document.getElementById('log').innerHTML = '';
      document.getElementById('missions').innerHTML = '';
      document.getElementById('chat').checked = c.chat !== false;
      setNightUI(c);
      document.getElementById('hint').textContent = '알은 배고프지도 지루하지도 않아요. 기다리거나 쓰다듬어 주세요.';
      return;
    }

    document.getElementById('age').textContent = c.age + '살 · ' + c.title;
    var bg = document.getElementById('badge');
    bg.textContent = c.badge || '';
    bg.hidden = !c.badge;

    var pct = c.expNeed ? Math.min(100, Math.round(c.exp / c.expNeed * 100)) : 0;
    document.getElementById('expBar').style.width = pct + '%';
    document.getElementById('expText').textContent =
      '다음 나이까지 ' + c.exp + ' / ' + c.expNeed +
      '   ·   오늘 얻은 경험치 ' + c.dayExp;

    KEYS.forEach(function(k){ setStat(k, c[k]); });
    drawTraits(c);
    drawTricks(c);

    // 밥·간식·놀기는 종류 줄로 옮겨 갔다 — 그쪽에서 잠근다.
    // 나머지는 care.js 의 판정(c.blocked)만 쓴다. 여기서 조건을 다시 적으면
    // 그 순간 두 벌이 되고, 실제로 훈련이 세 살 전에도 눌리던 적이 있다.
    var why = c.blocked || {};
    var NAMES = { walk: '산책', train: '훈련', clean: '치우기', sleep: '재우기' };
    ['walk', 'train', 'clean'].forEach(function(k){
      var b = document.getElementById(k);
      b.disabled = !!why[k];
      b.title = why[k] || '';
      if (why[k]) b.setAttribute('data-why', why[k]); else b.removeAttribute('data-why');
    });
    var sleep = document.getElementById('sleep');
    sleep.textContent = c.sleeping ? '깨우기' : '재우기';
    sleep.disabled = !!why.sleep;
    sleep.title = why.sleep ||
      (c.napKind === 'auto' ? '스스로 잠들었어요 — 깨우면 그대로 깨어 있어요' : '');
    if (sleep.title) sleep.setAttribute('data-why', sleep.title);
    else sleep.removeAttribute('data-why');
    // 막힌 것들을 한 줄로 적어 둔다 — 툴팁은 다시 그려지면 사라진다
    var stuck = ['walk', 'train', 'sleep', 'clean']
      .filter(function(k){ return why[k]; })
      // 은/는 은 받침을 따져야 한다 — 줄표로 두면 그럴 일이 없다
      .map(function(k){ return NAMES[k] + ' — ' + why[k]; });
    document.getElementById('whyacts').textContent = stuck.join('   ·   ');

    document.getElementById('chat').checked = c.chat !== false;
    document.getElementById('stretch').checked = !!c.stretch;
    document.getElementById('stretchLabel').textContent =
      (c.stretchMin || 50) + '분 넘게 앉아 있으면 부르기';
    setNightUI(c);
    document.getElementById('hint').textContent = c.hint || '';
    // 내용은 지금 채워졌다 — 빈 카드 판단을 다시 한다(스크롤은 건드리지 않음)
    showTab(current);
  });

  document.getElementById('stretch').addEventListener('change', function(){
    care.setStretch(this.checked);
  });

  document.getElementById('chat').addEventListener('change', function(){
    api.setChat(this.checked);
  });
  document.getElementById('night').addEventListener('change', function(){
    api.setNight(this.checked);
  });
  document.getElementById('away').addEventListener('change', function(){
    api.setAway(this.checked);
  });
  document.getElementById('zoom').addEventListener('change', function(){
    api.setZoom(this.checked);
  });

  /* If the egg opened on someone you were not hoping for, this hands
     back another one. Nothing is lost — the pet you have stays in the
     roster — so it does not need a confirmation. */
  document.getElementById('restart').addEventListener('click', function(){
    if(!this.disabled) api.restart();
  });

  ['walk','train','sleep','clean'].forEach(function(k){
    document.getElementById(k).addEventListener('click', function(){ api.act(k); });
  });

  api.ready();
})();
</script>
</body></html>
