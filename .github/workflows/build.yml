name: build

# 이 저장소를 GitHub에 올리고 Actions 탭에서 "Run workflow"를 누르면
# macOS 러너가 .dmg / .app 을, Windows 러너가 설치 프로그램을 구워 줍니다.
# 로컬에 맥이 없어도 .app 을 얻을 수 있는 방법입니다.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 코드 서명 없이 빌드
      - uses: actions/upload-artifact@v4
        with:
          name: MokaPet-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MokaPet-Windows
          path: |
            dist/*.exe
